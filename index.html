<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>동랑서미전</title>
<style>
:root{--bg:#f3efe6;--fg:#1d2330;--mut:#6a7080;--card:#fffdf8;--line:#d9d2c3;--e:#c2452d;--w:#2b6cb0;--ac:#1d2330;--acf:#f3efe6}
@media(prefers-color-scheme:dark){:root{--bg:#141a26;--fg:#ece6d8;--mut:#9aa3b5;--card:#1c2535;--line:#2e3a50;--e:#ef7b62;--w:#6fa8e8;--ac:#ece6d8;--acf:#141a26}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:30rem;margin:0 auto;padding:calc(1.5rem + env(safe-area-inset-top,0px)) 1rem calc(3rem + env(safe-area-inset-bottom,0px))}
h1{font:700 2.4rem/1.1 "Noto Serif KR","Nanum Myeongjo",serif;margin:0;letter-spacing:.04em}
.sub{color:var(--mut);margin:.2rem 0 1.2rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem;margin:0 0 1rem}
.card h2{font-size:1rem;margin:0 0 .6rem}
ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.4rem}
li{border:1.5px solid var(--line);border-radius:99px;padding:.15rem .8rem;font-size:.95rem}
li.e{border-color:var(--e);color:var(--e)}li.w{border-color:var(--w);color:var(--w)}li.off{opacity:.5}
li small{opacity:.8}
.role{font:700 1.5rem/1.3 "Noto Serif KR","Nanum Myeongjo",serif}
.role.e{color:var(--e)}.role.w{color:var(--w)}
.code{font:700 2rem/1.2 "Noto Serif KR",serif;letter-spacing:.3em}
input,select,button{font:inherit;width:100%;padding:.7rem .8rem;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);margin:.3rem 0}
button{background:var(--ac);color:var(--acf);border:0;font-weight:700;cursor:pointer}
button.g{background:none;color:var(--mut);border:1px solid var(--line)}
button:disabled{opacity:.4}
:focus-visible{outline:3px solid var(--w);outline-offset:2px}
.n{color:var(--mut);font-size:.9rem;margin:.4rem 0 0}
label.n{display:block}
.top{display:flex;justify-content:flex-start;margin:-.6rem 0 .8rem}
.sbadge{position:fixed;top:calc(.6rem + env(safe-area-inset-top,0px));right:.6rem;z-index:30;width:auto;margin:0;padding:.35rem .9rem;border-radius:99px;font-size:.95rem}
#side{position:fixed;top:0;right:0;bottom:0;width:min(22rem,92vw);background:var(--card);border-left:1px solid var(--line);padding:calc(3.2rem + env(safe-area-inset-top,0px)) 1rem 2rem;overflow:auto;z-index:20;box-shadow:-6px 0 18px rgba(0,0,0,.18)}
#side[hidden]{display:none}
.board h2{font-size:1.4rem;margin:0 0 .8rem}
.board p{font-size:1.35rem;line-height:1.5;margin:.5rem 0}
button.sm{width:auto;padding:.3rem .9rem;font-size:.9rem;margin:0}
.rl p{margin:.3rem 0}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.sides ul{flex-direction:column;align-items:flex-start}
.sides .sw{color:var(--w);font-weight:700;margin:0 0 .3rem}
.sides .se{color:var(--e);font-weight:700;margin:0 0 .3rem;text-align:right}
.sides>div:last-child ul{align-items:flex-end}
#t{position:fixed;left:1rem;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));background:var(--ac);color:var(--acf);padding:.8rem 1rem;border-radius:8px;max-width:28rem;margin:0 auto}
</style></head>
<body><main><h1>동랑서미전</h1><p class="sub">東狼西羊戰</p><div class="top"><button class="g sm" id="rb">설명서</button></div><div id="app"><p class="n">연결 중…</p></div></main><div id="t" hidden role="status"></div><button id="sb" class="sbadge" hidden aria-label="내 점수 내역 열기"></button><aside id="side" hidden aria-label="내 점수 내역"></aside>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let ws,V=null,sel={},rules=false,cfg={total:10,every:3},hv={nm:"",cd:""},pressed=false,dirty=false,pt=null,side=false,lastOpen=0;
let tok=localStorage.getItem("drtok");
if(!tok){tok=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("drtok",tok)}
const saved=()=>{try{return JSON.parse(localStorage.getItem("dr")||"null")}catch(e){return null}};
const tt=m=>{const t=$("#t");t.textContent=m;t.hidden=false;clearTimeout(tt.h);tt.h=setTimeout(()=>t.hidden=true,4000)};
const tx=o=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(o));else tt("연결 중이에요. 잠시 후 다시 눌러 주세요.")};

function conn(){
  ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
  ws.onopen=()=>{const s=saved();if(s)tx({t:"join",tok,name:s.name,code:s.code});render()};
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.t==="state"){
      V=m;
      if(V.phase==="lobby")lastOpen=0;
      if(V.phase==="result"&&lastOpen!==V.day){lastOpen=V.day;side=true}
      const me=V.players.find(x=>x.id===V.me);
      try{localStorage.setItem("dr",JSON.stringify({name:me?me.name:"",code:V.code}))}catch(x){}
      render();
    }else if(m.t==="err")tt(m.m);
    else if(m.t==="kicked"){localStorage.removeItem("dr");V=null;sel={};tt("방장이 당신을 추방했어요.");render()}
    else if(m.t==="gone"){localStorage.removeItem("dr");V=null;tt("방을 찾을 수 없어요.");render()}
  };
  ws.onclose=()=>setTimeout(conn,2000);
}
setInterval(()=>{if(ws&&ws.readyState===1)ws.send('{"t":"ping"}')},25000);

const RULES=`<div class="rl">
<div class="card"><h2>게임 목표</h2><p>정해진 턴이 끝났을 때 가장 많은 점수를 얻은 사람이 우승해요. 동점이면 공동 우승이에요.</p></div>
<div class="card"><h2>진영과 역할</h2><p>모두 동쪽이나 서쪽 진영 중 하나이고, 양이나 늑대 역할 중 하나예요. 진영과 역할은 매일 새로 랜덤으로 정해져요. 양이 될지 늑대가 될지 확률은 알 수 없고, 모두 양이거나 모두 늑대인 날도 있어요.</p><p>다른 사람의 역할과 점수는 알 수 없지만, 진영은 볼 수 있어요.</p></div>
<div class="card"><h2>하루의 흐름</h2><p><b>1. 역할 뽑기</b> — 진영과 역할이 정해지기 전에 능력을 쓸지 정해요.</p><p><b>2. 밤 · 하울링</b> — 늑대만 하울링을 쓸지 정해요.</p><p><b>3. 밤 · 행동</b> — 양은 스킬을 고르고, 늑대는 공격할 사람을 골라요. 모두 동시에 정해요.</p><p><b>4. 아침</b> — 밤이 끝나면 모두 확인을 눌러요. 모두 누르면 투표로 넘어가요.</p><p><b>5. 아침 투표</b> — 한 사람을 지목하고, 그 사람이 양인지 늑대인지 골라요.</p><p><b>6. 결과</b> — 투표 결과와 내 점수를 확인해요. 모두 확인을 누르면 다음 날이 시작돼요.</p></div>
<div class="card"><h2>능력 (진영 및 역할 선택)</h2><p>게임 전체에서 최대 2번, 진영과 역할을 직접 고를 수 있어요. 쓰면 "능력을 사용했습니다"라는 사실이 모두에게 알려지지만, 무엇을 골랐는지는 비밀이에요. 역할이 고정된 날에는 쓸 수 없어요.</p></div>
<div class="card"><h2>양</h2><p>밤에 아무 행동도 하지 않고 늑대에게 공격받지 않으면 <b>+3점</b>이에요. 공격받으면 이 점수를 받지 못해요.</p><p><b>양치기 부르기</b> — 공격받았다면 +2점을 받고, 몇 명이 나를 공격했는지 알 수 있어요. 공격한 늑대는 다음 턴에 늑대로 고정돼요(진영은 랜덤). 공격받지 않았다면 -2점이에요.</p><p><b>사냥꾼 부르기</b> — 공격받았다면 +1점이고, 공격한 늑대는 다음 턴 점수를 계산한 뒤 -2점을 받아요. 공격받지 않았다면 -4점이에요.</p><p><b>위장</b> — 한 게임에 1번, 그날 밤에만 나를 늑대로 판정하게 해요. 늑대의 행동과 스킬은 쓸 수 없고, 양의 스킬과 생존 +3점도 받지 못해요. 아침 투표에서는 그대로 양으로 취급돼요.</p></div>
<div class="card"><h2>늑대</h2><p>밤마다 자기 자신을 뺀 다른 사람 한 명을 공격할 수 있어요.</p><p><b>양을 공격하면</b> — 같은 진영 양 +1점, 다른 진영 양 +3점이에요.</p><p><b>늑대를 공격하면</b> — 같은 진영 늑대 0점, 다른 진영 늑대 -3점이에요. 위장한 양은 늑대로 취급돼요.</p><p><b>공격을 포기하면</b> — -1점을 받고 굶주림 상태가 돼요.</p><p>여러 늑대가 같은 양을 공격하면 늑대마다 따로 점수를 받아요.</p></div>
<div class="card"><h2>굶주림</h2><p>공격을 포기한 늑대가 걸리는 상태예요. 다음에 늑대가 되었을 때 양을 잡아서 얻는 점수가 2배(같은 진영 +2점, 다른 진영 +6점)가 돼요. 대신 늑대를 공격해서 잃는 점수도 커져요(같은 진영 -1점, 다른 진영 -6점). 중첩되지 않아요.</p></div>
<div class="card"><h2>하울링</h2><p>하울링을 쓴 늑대끼리는 서로의 이름을 알 수 있어요. 한 게임에 최대 3번 쓸 수 있고, 밤 행동보다 먼저 정해요. 같이 쓰는 늑대가 아무도 없으면, 내가 늑대라는 사실이 모두에게 알려지고 -2점이에요.</p></div>
<div class="card"><h2>아침 투표</h2><p>모두 한 사람을 지목하고, 그 사람이 양인지 늑대인지 골라요. 자기 자신도 지목할 수 있어요. "양"으로 지목받은 사람 중 득표 1위와 "늑대"로 지목받은 사람 중 득표 1위가 각각 정해져요. 동표면 동표인 사람들만 후보로 다시 투표해요(그래도 동표면 무작위).</p><p><b>맞았다면</b> — 뽑힌 사람은 다음 턴에 그 역할로 고정되고(진영은 랜덤), 다음 투표 후보에서 빠져요.</p><p><b>틀렸다면</b> — 뽑힌 사람을 뺀 모두가 -2점이에요.</p><p>양 쪽 결과와 늑대 쪽 결과는 따로 적용돼요. 누가 누구를 지목했는지는 비밀이고, 득표수만 공개돼요.</p></div>
<div class="card"><h2>점수 보기</h2><p>내 점수는 투표가 끝난 뒤에 오른쪽 위에 표시되고, 눌러서 밤에 일어난 일과 점수가 바뀐 이유를 볼 수 있어요. 다음 결과가 나올 때까지 그대로예요. 모두의 점수는 방장이 정한 주기마다 공개되고, 마지막에는 최종 순위가 나와요.</p></div>
</div>`;
const signed=n=>(n>0?"+":"")+n;
function renderChrome(){
  const sb=$("#sb"),sd=$("#side");
  const has=!!(V&&V.my&&V.my.shown!=null);
  sb.hidden=!has;
  if(has)sb.textContent="내 점수 "+V.my.shown+"점";
  if(!has)side=false;
  sd.hidden=!side;
  if(!side||!V)return;
  const l=V.log;
  if(!l){sd.innerHTML=`<button class="g" data-a="sideClose">닫기</button><p class="n">첫 투표 결과가 나오면 점수 내역을 볼 수 있어요.</p>`;return}
  const li=e=>`<p>${esc(e.w)}${e.d?` <b>${signed(e.d)}점</b>`:""}</p>`;
  const sec=(t,k,empty)=>{const a=l.filter(e=>e.k===k);return `<h2>${t}</h2>${a.length?a.map(li).join(""):`<p class="n">${empty}</p>`}`};
  const day=l.reduce((a,e)=>a+e.d,0);
  sd.innerHTML=`<button class="g" data-a="sideClose">닫기</button><h2>${V.logDay}일차 점수 내역</h2>${sec("밤에 일어난 일","n","점수가 바뀐 일이 없어요.")}${sec("아침 투표 결과","v","점수가 바뀐 일이 없어요.")}<p class="role">내 점수 ${V.my.shown}점</p><p class="n">${V.logDay}일차에 ${signed(day)}점</p>`;
}
function render(){
  renderChrome();
  $("#rb").textContent=rules?"설명서 닫기":"설명서";
  if(pressed||(document.activeElement&&document.activeElement.tagName==="INPUT")){dirty=true;return}
  dirty=false;
  if(rules){$("#app").innerHTML=RULES+`<button data-a="rulesClose">닫기</button>`;return}
  if(!V){
    $("#app").innerHTML=`<div class="card"><input id="nm" maxlength="12" placeholder="내 이름" aria-label="이름" value="${esc(hv.nm)}"><button data-a="create">새 방 만들기</button></div>
<div class="card"><input id="cd" maxlength="4" placeholder="방 코드 4글자" aria-label="방 코드" value="${esc(hv.cd)}"><button data-a="join">방에 들어가기</button></div>`;
    return;
  }
  const ph=V.phase,pl=V.players,me=pl.find(x=>x.id===V.me)||{};
  const cls=p=>p.faction==="동"?"e":p.faction==="서"?"w":"";
  const chip=p=>`<li class="${cls(p)}${p.on?"":" off"}">${esc(p.name)}${p.hw?" <small>하울링</small>":""}${p.bot?" (봇)":""}${p.id===V.me?" (나)":""}</li>`;
  const split=ph!=="lobby"&&ph!=="draw"&&pl.some(p=>p.faction);
  const listHtml=split
    ?`<div class="sides"><div><p class="sw">서쪽</p><ul>${pl.filter(p=>p.faction==="서").map(chip).join("")}</ul></div><div><p class="se">동쪽</p><ul>${pl.filter(p=>p.faction==="동").map(chip).join("")}</ul></div></div>`
    :`<ul>${pl.map(chip).join("")}</ul>`;
  let h=`<div class="card"><p class="n">방 코드</p><div class="code">${esc(V.code)}</div><h2>${ph==="lobby"?"대기실 · "+pl.length+"명":V.day+"/"+V.total+"일차 · "+{draw:"역할 뽑기",howl:"밤 · 하울링",night:"밤 · 행동",dawn:"아침",vote:"아침 투표",result:"투표 결과",end:"게임 종료"}[ph]}</h2>${listHtml}</div>`;
  if(V.role)h+=`<div class="card"><p class="n">오늘의 나</p><div class="role ${cls(me)}">${me.faction}쪽 ${V.role}</div></div>`;
  if(V.board)h+=`<div class="card board"><h2>${ph==="end"?"최종 순위":"중간 점수"}</h2>${V.board.map((b,i)=>`<p>${i+1}. ${esc(b.name)} — ${b.score}점${b.win?" · 우승":""}</p>`).join("")}</div>`;
  if(V.pub&&V.pub.length&&ph!=="draw")h+=`<div class="card"><h2>공개 소식</h2>${V.pub.map(x=>`<p>${esc(x)}</p>`).join("")}</div>`;
  if(V.note&&(ph==="night"||ph==="dawn"||ph==="vote"))h+=`<div class="card"><h2>나에게만 온 소식</h2><p>${esc(V.note)}</p></div>`;
  const others=pl.filter(x=>x.id!==V.me);
  const opts=(k,t,l)=>`<select data-k="${k}" aria-label="${t}"><option value="">${t}</option>${(l||others).map(p=>`<option value="${p.id}"${sel[k]===p.id?" selected":""}>${esc(p.name)}</option>`).join("")}</select>`;
  if(ph==="lobby"){
    h+=V.host?`<p class="n">친구들에게 방 코드를 알려 주세요. 원활한 진행에는 4명 이상을 권장해요.</p><label class="n" for="tot">진행 턴 수 (최소 10턴)</label><input id="tot" type="number" inputmode="numeric" min="10" max="99" value="${esc(cfg.total)}"><label class="n" for="ev">모두의 점수를 공개하는 주기 (턴마다, 0이면 공개 안 함)</label><input id="ev" type="number" inputmode="numeric" min="0" max="99" value="${esc(cfg.every)}"><button class="g" data-a="addbot"${pl.length>=50?" disabled":""}>봇 추가</button>${pl.some(p=>p.bot)?`<button class="g" data-a="rmbot">봇 한 명 빼기</button>`:""}<button data-a="start"${pl.length<2?" disabled":""}>게임 시작</button>`:`<p class="n">방장이 시작하기를 기다리는 중이에요.</p>`;
  }else if(ph==="end"){
    h+=`<p class="n">게임이 끝났어요. 가장 높은 점수를 얻은 사람이 우승이에요. 동점이면 공동 우승이에요.</p>`;
  }else if(ph==="result"){
    const r=V.res||{},tal=r.tal||{};
    const tl=k=>(tal[k]||[]).map((c,i,arr)=>`<p class="n">${arr.length>1?(i?"재투표":"1차 투표"):"득표"}: ${c.length?c.map(x=>esc(x.name)+" "+x.n+"표").join(" · "):"없음"}</p>`).join("");
    const kind=(t,k,x,role)=>`<div class="card"><h2>${t} 투표 결과</h2>${tl(k)}${x?`<p><b>1위: ${esc(x.name)}</b> — 정체가 ${x.ok?"맞았어요":"아니었어요"}.</p><p>${x.ok?`다음 턴에 ${role==="양"?"양으로":"늑대로"} 고정됩니다. (진영은 랜덤)`:"투표로 뽑힌 사람을 제외한 모두의 점수를 -2점 깎습니다."}</p>`:`<p>뽑힌 사람이 없어요. (기권 처리)</p>`}</div>`;
    h+=kind("양","sheep",r.sheep,"양")+kind("늑대","wolf",r.wolf,"늑대")+`<button class="g" data-a="sideOpen">내 점수 내역 보기</button>`+`<p class="n">${V.every>0?`다른 사람의 점수는 ${V.every}턴마다 공개돼요.`:"중간 점수는 공개되지 않아요. 마지막에 최종 순위가 나와요."}</p>`;
    h+=me.done?`<p class="n">확인했어요. 다른 사람을 기다리는 중이에요.</p>`:`<button data-a="ok">${V.day>=V.total?"확인 (최종 순위 보기)":"확인 (다음 밤으로)"}</button>`;
  }else if(ph==="dawn"){
    h+=`<div class="card"><h2>아침이 밝았어요</h2><p>밤이 지났어요. 모두 확인을 누르면 아침 투표로 넘어가요.</p></div>`+(me.done?`<p class="n">확인했어요. 다른 사람을 기다리는 중이에요.</p>`:`<button data-a="ok">확인</button>`);
  }else if(me.done){
    h+=`<div class="card">${ph==="howl"&&V.role!=="늑대"?"늑대들이 하울링을 정하는 중이에요.":"제출했어요. 다른 사람을 기다리는 중이에요."}</div>`;
  }else if(ph==="draw"){
    const my=V.my||{};
    if(my.lock)h+=`<div class="card"><h2>역할이 고정된 날이에요</h2><p>오늘 당신의 역할은 <b>${my.lockRole}</b>이에요. 진영은 밤이 되면 알려져요. 능력은 쓸 수 없어요.</p><button data-a="draw">확인</button></div>`;
    else{
      h+=`<div class="card"><h2>오늘 능력을 쓸까요?</h2><p class="n">진영과 역할을 직접 정하는 능력이에요. 쓰면 사용했다는 사실이 모두에게 알려지고, 무엇을 골랐는지는 비밀이에요. 쓰지 않으면 진영과 역할이 랜덤으로 정해져요.</p><button data-a="draw">능력 쓰지 않기</button></div>`;
      if(my.abil<2)h+=`<div class="card"><h2>능력 사용 (남은 ${2-my.abil}회)</h2><select data-k="f" aria-label="진영"><option value="">진영 선택</option><option value="동"${sel.f==="동"?" selected":""}>동쪽</option><option value="서"${sel.f==="서"?" selected":""}>서쪽</option></select><select data-k="r" aria-label="역할"><option value="">역할 선택</option><option value="양"${sel.r==="양"?" selected":""}>양</option><option value="늑대"${sel.r==="늑대"?" selected":""}>늑대</option></select><button class="g" data-a="ability">능력 사용하기</button></div>`;
    }
  }else if(ph==="howl"){
    const my=V.my||{};
    h+=`<div class="card"><h2>하울링을 할까요?</h2><p class="n">하울링한 늑대끼리는 서로를 알 수 있어요. 혼자만 하면 정체가 모두에게 알려지고 -2점이에요. 하울링이 끝나면 모두 밤 행동을 정해요.</p><select data-k="h" aria-label="하울링"><option value="">하울링 안 함</option>${my.howl<3?`<option value="1"${sel.h==="1"?" selected":""}>하울링 하기 (남은 ${3-my.howl}회)</option>`:""}</select><button data-a="howl">결정하기</button></div>`;
  }else if(ph==="night"){
    const my=V.my||{};
    const so=(v,t)=>`<option value="${v}"${sel.k===v?" selected":""}>${t}</option>`;
    h+=V.role==="늑대"
      ?`<div class="card"><h2>누구를 공격할까요?</h2>${opts("t","공격 포기 (-1점, 굶주림)")}<button data-a="act">밤 보내기</button></div>`
      :`<div class="card"><h2>밤에 무엇을 할까요?</h2><select data-k="k" aria-label="스킬">${so("","아무것도 안 함")}${so("shepherd","양치기 부르기")}${so("hunter","사냥꾼 부르기")}${my.dis<1?so("disguise","늑대로 위장 (1회)"):""}</select><button data-a="act">밤 보내기</button></div>`;
  }else if(ph==="vote"){
    const tie=!!(V.cand.sheep||V.cand.wolf);
    if(!tie){
      h+=`<div class="card"><h2>누가 양이고 누가 늑대일까요?</h2><p class="n">한 사람을 지목하고, 그 사람이 양인지 늑대인지 골라요. 자기 자신도 지목할 수 있어요.</p>${opts("vt","지목할 사람",pl.filter(p=>!p.ex))}<select data-k="vg" aria-label="양인지 늑대인지"><option value="">양 / 늑대 선택</option><option value="sheep"${sel.vg==="sheep"?" selected":""}>이 사람은 양이에요</option><option value="wolf"${sel.vg==="wolf"?" selected":""}>이 사람은 늑대예요</option></select><button data-a="vote">투표하기</button></div>`;
    }else{
      const items=[];
      ["sheep","wolf"].forEach(k=>{if(V.need[k]&&V.cand[k])V.cand[k].forEach(id=>{const p=pl.find(x=>x.id===id);if(p)items.push({v:k+":"+id,t:p.name+" — "+(k==="sheep"?"양으로":"늑대로")+" 지목"})})});
      h+=`<div class="card"><h2>동표예요. 후보 중에서 다시 투표해요</h2><select data-k="vc" aria-label="후보"><option value="">후보 선택</option>${items.map(i=>`<option value="${i.v}"${sel.vc===i.v?" selected":""}>${esc(i.t)}</option>`).join("")}</select><button data-a="vote">투표하기</button></div>`;
    }
  }
  if(V.host&&["draw","howl","night","dawn","vote","result"].includes(ph))h+=`<p class="n">${["dawn","result"].includes(ph)?"확인":"제출"} ${pl.filter(p=>p.done).length}/${pl.length}</p><button class="g" data-a="force">지금 넘기기</button>`;
  if(V.host&&others.length)h+=`<div class="card"><h2>플레이어 추방</h2>${opts("x","추방할 사람 선택")}<button class="g" data-a="kick">추방하기</button></div>`;
  if(V.host&&ph!=="lobby")h+=`<button class="g" data-a="reset">새 게임 (대기실로)</button>`;
  h+=`<button class="g" data-a="leave">방 나가기</button>`;
  $("#app").innerHTML=h;
}
$("#app").addEventListener("change",e=>{if(e.target.dataset.k)sel[e.target.dataset.k]=e.target.value});
$("#app").addEventListener("input",e=>{const i=e.target;if(i.id==="tot")cfg.total=i.value;if(i.id==="ev")cfg.every=i.value;if(i.id==="nm")hv.nm=i.value;if(i.id==="cd")hv.cd=i.value});
$("#app").addEventListener("focusout",()=>setTimeout(()=>{if(dirty)render()},400));
document.addEventListener("pointerdown",()=>{pressed=true;clearTimeout(pt);pt=setTimeout(()=>{pressed=false;if(dirty)render()},2500)},true);
const rel=()=>setTimeout(()=>{pressed=false;clearTimeout(pt);if(dirty)render()},80);
document.addEventListener("pointerup",rel,true);document.addEventListener("pointercancel",rel,true);
$("#sb").addEventListener("click",()=>{side=!side;renderChrome()});
$("#side").addEventListener("click",e=>{if(e.target.dataset.a==="sideClose"){side=false;renderChrome()}});
$("#rb").addEventListener("click",()=>{if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();rules=!rules;render();window.scrollTo(0,0)});
$("#app").addEventListener("click",e=>{
  const a=e.target.dataset.a;if(!a)return;
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  if(a==="sideOpen"){side=true;renderChrome();return}
  if(a==="rulesClose"){rules=false;render();window.scrollTo(0,0);return}
  if(a==="create"||a==="join"){
    const n=$("#nm")&&$("#nm").value.trim();
    if(!n)return tt("이름을 입력해 주세요.");
    if(a==="create")tx({t:"create",tok,name:n});
    else{
      const c=$("#cd").value.trim();
      if(!c)return tt("방 코드를 입력해 주세요.");
      tx({t:"join",tok,name:n,code:c});
    }
  }else if(a==="act"){tx({t:"act",target:sel.t||"",skill:sel.k||""});sel={}}
  else if(a==="howl"){tx({t:"howl",howl:sel.h==="1"});sel={}}
  else if(a==="vote"){
    const tie=!!(V.cand.sheep||V.cand.wolf);
    let g,t;
    if(tie){if(!sel.vc)return tt("후보를 골라 주세요.");[g,t]=sel.vc.split(":")}
    else{if(!sel.vt||!sel.vg)return tt("지목할 사람과 양/늑대를 모두 골라 주세요.");g=sel.vg;t=sel.vt}
    tx({t:"vote",guess:g,target:t});sel={};
  }else if(a==="leave"){localStorage.removeItem("dr");V=null;sel={};ws.close()}
  else if(a==="ability"){if(!sel.f||!sel.r)return tt("진영과 역할을 모두 골라 주세요.");tx({t:"draw",ab:true,faction:sel.f,role:sel.r});sel={}}
  else if(a==="kick"){
    if(!sel.x)return tt("추방할 사람을 골라 주세요.");
    const t=V.players.find(p=>p.id===sel.x);
    if(!confirm((t?t.name:"이 사람")+"님을 추방할까요?"))return;
    tx({t:"kick",id:sel.x});sel.x="";
  }
  else if(a==="start"){const tn=parseInt(cfg.total),ev=parseInt(cfg.every);if(!isNaN(tn)&&tn<10)return tt("진행 턴 수는 최소 10턴이에요.");tx({t:"start",total:isNaN(tn)?10:tn,every:isNaN(ev)?3:ev})}
  else tx({t:a});
});
conn();
</script></body></html>
